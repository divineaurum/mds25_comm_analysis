<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ тем комментариев</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1 class="header__title">Анализ тем пользовательских комментариев</h1>
      <p class="header__subtitle">BERTopic + LLM + RAG</p>
    </div>
  </header>

  <main class="container">

    <section class="card form-card">
      <h2 class="section-title">Настройки анализа</h2>

      <div class="form-group">
        <label for="product-select" class="form-label">Продукт</label>
        <select id="product-select" class="form-control">
          <option value="">Загрузка списка...</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date-from" class="form-label">С</label>
          <input type="date" id="date-from" class="form-control">
        </div>
        <div class="form-group">
          <label for="date-to" class="form-label">По</label>
          <input type="date" id="date-to" class="form-control">
        </div>
      </div>

      <p id="stats-info" class="stats-info" hidden></p>

      <button id="analyze-btn" class="btn btn-primary" disabled>
        Анализировать
      </button>
    </section>

    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p class="loading__text">
        Выполняется анализ...
        <span class="loading__hint">Это может занять 1–3 минуты</span>
      </p>
    </div>

    <div id="error-msg" class="error-msg" hidden></div>

    <section id="results" hidden>
      <div class="results-header">
        <h2 class="section-title" id="results-title"></h2>
        <p class="results-meta" id="results-meta"></p>
      </div>
      <div id="topics-grid" class="topics-grid"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
